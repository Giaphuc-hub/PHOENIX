<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <!-- Thư viện FontAwesome để lấy icon con mắt -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS cua dang ky.css">
</head>
<body>
    <img src="images.jpg" alt="Logo" class="logo">
    <div class="container">
        <div class="sign">
            <h1>Đăng ký</h1>
        </div>
        <form action="Menu.html">
            <div class="input">
                <!-- Ô nhập tài khoản -->
                <input type="text" placeholder="Họ và tên/Tên đăng ký" required>
                <input type="email" placeholder="Email" required>
                <br><br>
                
                <div class="pass-box">
                    <!-- Ô nhập mật khẩu -->
                    <input type="password" id="pass" placeholder="Mật khẩu" required>
                    
                    <!-- Icon con mắt (Mặc định là mắt gạch chéo vì mật khẩu đang ẩn) -->
                    <i class="fa-solid fa-eye-slash" id="togglePassword"></i>
                </div>
                <div class="ngaysinh">
                    <input type="date" required>
                </div>
    
                <div class="khoahoc">
                    <select id="khoa-hoc" required>
                        <option value="" disabled selected>-- Chọn khóa học --</option>
                        <option value="toan">Toán</option>
                        <option value="van">Ngữ Văn</option>
                        <option value="anh">Tiếng Anh</option>
                        <option value="khtn">Khoa học tự nhiên</option>
                        <option value="tin">Tin học</option>
                        <option value="ve">Vẽ</option>
                        <option value="viet">Viết chữ đẹp</option>
                    </select>
                </div>
                <div class="button">
                    <button type="submit">Đăng ký</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Đoạn mã JavaScript xử lý ẩn/hiện mật khẩu và đổi icon chính xác -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('pass');

        togglePassword.addEventListener('click', function () {
            // Đổi type của input mật khẩu giữa password và text
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Đổi icon con mắt dựa trên trạng thái hiển thị thực tế
            if (type === 'text') {
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');      // Thấy mật khẩu -> Mắt mở
            } else {
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash'); // Ẩn mật khẩu -> Mắt gạch chéo
            }
        });
    </script>
</body>
</html>
